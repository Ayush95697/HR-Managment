<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#b042ff" />
    </linearGradient>
    <linearGradient id="cyanGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cubeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container glow -->
  <circle cx="50" cy="50" r="46" fill="#090a12" stroke="url(#cyanGradient)" stroke-width="1.5" opacity="0.9" />

  <!-- Flow Path Filaments (Interwoven purple & cyan lines) -->
  <path d="M 20 65 Q 35 25 50 50 T 80 35" fill="none" stroke="url(#purpleGradient)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 20 35 Q 45 75 60 40 T 80 65" fill="none" stroke="url(#cyanGradient)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 28 48 C 40 30, 60 70, 72 52" fill="none" stroke="#00FFFF" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />

  <!-- Floating Data Nodes / Cubes -->
  <!-- Cube 1 (Center Top) -->
  <g transform="translate(44, 22) scale(0.7)" filter="url(#cubeGlow)">
    <polygon points="10,0 20,5 10,10 0,5" fill="#00FFFF" opacity="0.9" />
    <polygon points="0,5 10,10 10,20 0,15" fill="#7F00FF" opacity="0.85" />
    <polygon points="10,10 20,5 20,15 10,20" fill="#38bdf8" opacity="0.95" />
  </g>

  <!-- Cube 2 (Right Mid) -->
  <g transform="translate(68, 48) scale(0.6)" filter="url(#cubeGlow)">
    <polygon points="10,0 20,5 10,10 0,5" fill="#7F00FF" opacity="0.95" />
    <polygon points="0,5 10,10 10,20 0,15" fill="#00FFFF" opacity="0.8" />
    <polygon points="10,10 20,5 20,15 10,20" fill="#b042ff" opacity="0.9" />
  </g>

  <!-- Cube 3 (Left Low) -->
  <g transform="translate(24, 56) scale(0.55)" filter="url(#cubeGlow)">
    <polygon points="10,0 20,5 10,10 0,5" fill="#00FFFF" opacity="0.9" />
    <polygon points="0,5 10,10 10,20 0,15" fill="#38bdf8" opacity="0.75" />
    <polygon points="10,10 20,5 20,15 10,20" fill="#7F00FF" opacity="0.95" />
  </g>

  <!-- Node Dots -->
  <circle cx="50" cy="50" r="3" fill="#ffffff" filter="url(#glow)" />
  <circle cx="35" cy="38" r="2" fill="#00FFFF" />
  <circle cx="65" cy="60" r="2" fill="#7F00FF" />
</svg>